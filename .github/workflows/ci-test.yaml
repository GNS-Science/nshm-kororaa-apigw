name: QA test workflow (jest and lint)

on:
  push:
    branches-ignore: [deploy-test, main] # these are handled by deployment scripts

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows us to call the workflow from another workflow
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Yarn2
        uses: ./.github/actions/node-yarn2-install

      - name: Yarn test
        env:
          CI: true
        run: yarn test

      - name: Yarn lint
        run: yarn lint

      - name: Yarn prettier-check
        run: yarn prettier-check
